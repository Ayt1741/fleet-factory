name: llm3
on:
  workflow_dispatch:
jobs:
  l:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Три попытки LLM
        run: |
          exec > >(tee /tmp/llm.txt) 2>&1
          pip install -q requests
          python3 - <<'PY'
          import requests, time
          промт = open('llm-промт.txt', encoding='utf-8').read()
          отчёт = open('стенд-отчёт.txt', encoding='utf-8').read()
          полный = промт + chr(10)*2 + "ПОЛНЫЙ ЛОГ 36 ПРОМАХОВ:" + chr(10) + отчёт
          for номер in (1, 2, 3):
              print("=" * 70)
              print("ПОПЫТКА", номер)
              print("=" * 70, flush=True)
              ок = False
              for поп in range(3):
                  try:
                      if номер == 1:
                          r = requests.post("https://text.pollinations.ai/openai",
                              json={"model": "openai", "messages": [{"role": "user", "content": полный}], "temperature": 0.3}, timeout=180)
                          print("статус:", r.status_code, flush=True)
                          if r.status_code == 200:
                              print(r.json()["choices"][0]["message"]["content"], flush=True)
                              ок = True
                              break
                          print(r.text[:300], flush=True)
                      elif номер == 2:
                          r = requests.post("https://text.pollinations.ai/openai",
                              json={"model": "openai-fast", "messages": [{"role": "system", "content": "Отвечай только по делу."}, {"role": "user", "content": полный}]}, timeout=180)
                          print("статус:", r.status_code, flush=True)
                          if r.status_code == 200:
                              print(r.json()["choices"][0]["message"]["content"], flush=True)
                              ок = True
                              break
                          print(r.text[:300], flush=True)
                      else:
                          import urllib.parse
                          r = requests.get("https://text.pollinations.ai/" + urllib.parse.quote(полный[:2500]) + "?model=openai", timeout=180)
                          print("статус:", r.status_code, flush=True)
                          if r.status_code == 200 and len(r.text) > 50:
                              print(r.text[:5000], flush=True)
                              ок = True
                              break
                          print(r.text[:300], flush=True)
                  except Exception as e:
                      print("ошибка:", repr(e)[:200], flush=True)
                  time.sleep(50)
              if not ок:
                  print("ПОПЫТКА", номер, "НЕ УДАЛАСЬ", flush=True)
              time.sleep(50)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm
          path: /tmp/llm.txt
