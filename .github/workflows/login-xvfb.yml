name: login-xvfb
# Вход в Arena ТАК ЖЕ, как в battle_engine.py: xvfb-run + headed + AutomationControlled выключен.
# В headless Cloudflare Turnstile показывает «Подтвердите, что вы человек» и блокирует.
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Вход (headed под xvfb)
        env:
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_PASS: ${{ secrets.GOOGLE_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          mkdir -p /tmp/shots
          xvfb-run -a python - > /tmp/login.txt 2>&1 <<'PY'
          import base64, hashlib, hmac, os, re, struct, time
          from playwright.sync_api import sync_playwright

          def totp(secret):
              s = re.sub(r'\s+', '', secret).upper().rstrip('=')
              key = base64.b32decode(s + '=' * ((8 - len(s) % 8) % 8))
              h = hmac.new(key, struct.pack('>Q', int(time.time() // 30)), hashlib.sha1).digest()
              o = h[-1] & 0x0F
              return str((struct.unpack('>I', h[o:o+4])[0] & 0x7FFFFFFF) % 1000000).zfill(6)

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          АРГС = ['--no-sandbox', '--disable-dev-shm-usage', '--disable-blink-features=AutomationControlled']

          with sync_playwright() as p:
              b = p.chromium.launch(headless=False, args=АРГС)   # HEADED, как в battle_engine
              ctx = b.new_context(locale='ru-RU', user_agent=UA, viewport={'width':1400,'height':950})
              pg = ctx.new_page()
              pg.goto('https://arena.ai/text', timeout=120000)
              pg.wait_for_timeout(9000)
              pg.screenshot(path='/tmp/shots/01.png')
              print("url:", pg.url)
              t = pg.inner_text('body')
              print("Turnstile/человек:", 'человек' in t or 'Verification' in t or 'verify' in t.lower())
              # ждём, пока Turnstile пройдёт сам в headed-режиме (до 40 с)
              for _ in range(8):
                  if 'Verification' not in pg.inner_text('body') and 'человек' not in pg.inner_text('body'):
                      break
                  pg.wait_for_timeout(5000)
              pg.screenshot(path='/tmp/shots/02-после-turnstile.png')
              print("после ожидания Turnstile:", 'Verification' not in pg.inner_text('body'))
              # вход
              try:
                  pg.get_by_role('button', name='Log in').first.click(timeout=15000)
                  print("клик Log in ок")
              except Exception as e:
                  try:
                      pg.get_by_text('Log In', exact=False).first.click(timeout=8000)
                      print("клик по тексту Log In ок")
                  except Exception as e2:
                      print("клик не удался:", repr(e)[:100])
              pg.wait_for_timeout(5000)
              pg.screenshot(path='/tmp/shots/03-меню-входа.png')
              print("после клика:", pg.inner_text('body')[:250].replace("\n"," | "))
              # Google
              page = pg
              try:
                  with ctx.expect_page(timeout=20000) as инфо:
                      pg.locator("text=/Google/i").first.click(timeout=15000)
                  page = инфо.value
                  print("Google открылся в новой вкладке")
              except Exception as e:
                  print("новая вкладка не вышла:", repr(e)[:120])
                  try:
                      pg.locator("text=/Google/i").first.click(timeout=8000)
                      print("Google в той же вкладке")
                  except Exception as e2:
                      print("Google не найден:", repr(e2)[:120])
              page.wait_for_timeout(6000)
              try: page.screenshot(path='/tmp/shots/04-google.png')
              except Exception: pass
              print("url Google:", page.url, "|", page.title()[:60])
              try:
                  page.fill('input[type=email]', os.environ['GOOGLE_EMAIL'], timeout=25000)
                  page.keyboard.press('Enter'); page.wait_for_timeout(8000)
                  page.screenshot(path='/tmp/shots/05-после-email.png')
                  print("email ок, url:", page.url)
                  page.fill('input[type=password]', os.environ['GOOGLE_PASS'], timeout=25000)
                  page.keyboard.press('Enter'); page.wait_for_timeout(10000)
                  page.screenshot(path='/tmp/shots/06-после-пароля.png')
                  print("пароль ок, url:", page.url)
                  print("текст:", page.inner_text('body')[:250].replace("\n"," | "))
                  if page.locator('input[type=tel]').count() or 'code' in page.content().lower():
                      код = totp(os.environ['TOTP_SECRET'])
                      print("вводим TOTP:", код)
                      for сел in ['input[type=tel]', 'input[autocomplete="one-time-code"]']:
                          loc = page.locator(сел).first
                          if loc.count():
                              loc.fill(код); page.keyboard.press('Enter'); print("TOTP введён"); break
                      page.wait_for_timeout(12000)
                      page.screenshot(path='/tmp/shots/07-после-totp.png')
                      print("после TOTP url:", page.url)
              except Exception as e:
                  print("ШАГ GOOGLE УПАЛ:", repr(e)[:250])
                  try: page.screenshot(path='/tmp/shots/08-ошибка.png')
                  except Exception: pass
              try:
                  if page is not pg: page.close()
              except Exception: pass
              pg.goto('https://arena.ai/text', timeout=120000)
              pg.wait_for_timeout(10000)
              pg.screenshot(path='/tmp/shots/09-финал.png')
              t2 = pg.inner_text('body')
              print("=== ИТОГ ===")
              print("ВОШЁЛ:", 'Get started' not in t2 and 'Log In' not in t2 and 'Sign up' not in t2)
              print("есть Ask anything:", 'Ask anything' in t2)
              ctx.storage_state(path='state.json')
              print("размер state.json:", os.path.getsize('state.json'))
              b.close()
          PY
          cat /tmp/login.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login
          path: |
            /tmp/login.txt
            /tmp/shots/
            state.json
