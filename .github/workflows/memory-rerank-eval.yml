name: memory-rerank-eval
# Замер реранкера в облаке (16 ГБ — в песочнице 1,9 ГБ две ONNX-модели не влезают: OOM).
# Сравнивает одно и то же на одних и тех же наборах: без реранкера / с реранкером.
on:
  workflow_dispatch:
    inputs:
      vectors:
        description: "vectors=skip (готовые) | bge1024 — пересчёт торчем"
        required: false
        default: "skip"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  LC_ALL: C.UTF-8
  TOKENIZERS_PARALLELISM: "false"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet onnxruntime==1.19.2 transformers tokenizers sentencepiece pymorphy3 numpy
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu || pip install --quiet torch
          pip install --quiet sentence-transformers
          free -m | head -2

      - name: Забрать движок, векторы, наборы
        env:
          PAT: ${{ secrets.HRANILISHE_PAT }}
          ПФ_ПЕРЕСЧЁТ: "1"
        run: |
          mkdir -p движок/данные
          python - <<'PY'
          import os, base64, urllib.request, urllib.parse, json
          пат = os.environ["PAT"]
          def raw(путь, куда, минимум=1):
              url = ("https://raw.githubusercontent.com/Ayt1741/hranilishe/main/"
                     + urllib.parse.quote(путь))
              req = urllib.request.Request(url, headers={"User-Agent": "arena",
                                                         "Authorization": f"Bearer {пат}"})
              данные = urllib.request.urlopen(req, timeout=300).read()
              if len(данные) < минимум:
                  raise SystemExit(f"{куда}: {len(данные)} байт, ждали ≥{минимум}")
              open(куда, "wb").write(данные)
              print(куда, len(данные), "байт")
          raw("движок/engine.py", "движок/engine.py")
          raw("движок/перефразы.json", "движок/перефразы.json")
          try: raw("движок/перефразы-20.json", "движок/перефразы-20.json")
          except SystemExit as e: print("набора 20 нет:", e)
          raw("движок/наборы.json", "движок/наборы.json", 10)
          raw("движок/результат/вект-записи.npy", "движок/данные/вект-записи.npy", 1_000_000)
          raw("движок/результат/вект-записи_ном.npy", "движок/данные/вект-записи_ном.npy", 1000)
          try: raw("движок/данные/вект-вопросы.npy", "движок/данные/вект-вопросы.npy", 100000)
          except Exception as e: print("векторы вопросов не скачались:", repr(e)[:120])
          try: raw("движок/данные/вект-вопросы_ном.npy", "движок/данные/вект-вопросы_ном.npy", 100)
          except Exception as e: print("номера вопросов не скачались:", repr(e)[:120])
          PY


      - name: "Пересчёт векторов bge-m3 torch, 512 токенов (если vectors=bge512)"
        if: github.event.inputs.vectors == 'bge512'
        run: |
          cd движок
          exec > >(tee /tmp/bge512.log) 2>&1
          python - <<'PY'
          import importlib.util, os, sys, json, base64, urllib.request, urllib.parse, traceback
          spec = importlib.util.spec_from_file_location("eng", "engine.py")
          E = importlib.util.module_from_spec(spec); spec.loader.exec_module(E)
          try:
              E.скачать_журнал(); E.перестроить()
              # bge-m3 torch, как в #22: только длина 512 вместо 192 и текст 2000 знаков
              import numpy as np, time
              from sentence_transformers import SentenceTransformer
              import sqlite3
              con = sqlite3.connect(E.ИНДЕКС)
              стр = list(con.execute("SELECT н, substr(текст,1,2000) FROM записи ORDER BY н"))
              con.close()
              м = SentenceTransformer("BAAI/bge-m3", device="cpu"); м.max_seq_length = 512
              Е, t0 = [], time.time()
              for i in range(0, len(стр), 16):
                  Е.append(м.encode([с or "" for _, с in стр[i:i+16]], batch_size=16,
                                    normalize_embeddings=True, convert_to_numpy=True).astype(np.float32))
                  print(f"  {min(i+16,len(стр))}/{len(стр)} {time.time()-t0:.0f} с", flush=True)
              Ф = "данные/вект-записи.npy"
              np.save(Ф, np.vstack(Е)); np.save(Ф.replace(".npy","_ном.npy"), np.array([н for н,_ in стр], dtype=np.int64))
              print("готово:", len(стр), "векторов", flush=True)
          except Exception:
              traceback.print_exc(); print("::error title=bge512::" + repr(sys.exc_info()[1])[:250]); sys.exit(1)
          пат = os.environ.get("PAT", "")
          def put(путь, байты):
              импорт = urllib.parse.quote(путь)
              req = urllib.request.Request(f"https://api.github.com/repos/Ayt1741/hranilishe/contents/{импорт}",
                  headers={"Authorization": f"Bearer {пат}", "User-Agent": "arena", "Accept": "application/vnd.github+json"})
              ша = None
              try: ша = json.loads(urllib.request.urlopen(req, timeout=60).read()).get("sha")
              except Exception: pass
              тело = {"message": "векторы bge-m3 torch 512 токенов", "content": base64.b64encode(байты).decode()}
              if ша: тело["sha"] = ша
              req2 = urllib.request.Request(f"https://api.github.com/repos/Ayt1741/hranilishe/contents/{импорт}",
                  method="PUT", data=json.dumps(тело).encode(),
                  headers={"Authorization": f"Bearer {пат}", "User-Agent": "arena",
                           "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
              print("залито:", путь, flush=True); urllib.request.urlopen(req2, timeout=600).read()
          for ф in ("данные/вект-записи.npy", "данные/вект-записи_ном.npy"):
              put("движок/результат-bge512/" + os.path.basename(ф), open(ф, "rb").read())
          PY
        env:
          PAT: ${{ secrets.HRANILISHE_PAT }}


      - name: "Пересчёт векторов bge-m3 torch, 1024 токена (если vectors=bge1024)"
        if: github.event.inputs.vectors == 'bge1024'
        run: |
          cd движок
          exec > >(tee /tmp/bge1024.log) 2>&1
          python - <<'PY'
          import importlib.util, os, sys, json, base64, urllib.request, urllib.parse, traceback
          spec = importlib.util.spec_from_file_location("eng", "engine.py")
          E = importlib.util.module_from_spec(spec); spec.loader.exec_module(E)
          try:
              E.скачать_журнал(); E.перестроить()
              import numpy as np, time, sqlite3
              from sentence_transformers import SentenceTransformer
              con = sqlite3.connect(E.ИНДЕКС)
              стр = list(con.execute("SELECT н, substr(текст,1,2400) FROM записи ORDER BY н"))
              con.close()
              # 1024 токена покрывают 100% записей журнала (самая длинная 702 токена)
              м = SentenceTransformer("BAAI/bge-m3", device="cpu"); м.max_seq_length = 1024
              Е, t0 = [], time.time()
              for i in range(0, len(стр), 8):
                  Е.append(м.encode([с or "" for _, с in стр[i:i+8]], batch_size=8,
                                    normalize_embeddings=True, convert_to_numpy=True).astype(np.float32))
                  if (i//8) % 20 == 0: print(f"  {min(i+8,len(стр))}/{len(стр)} {time.time()-t0:.0f} с", flush=True)
              Ф = "данные/вект-записи.npy"
              np.save(Ф, np.vstack(Е)); np.save(Ф.replace(".npy","_ном.npy"), np.array([н for н,_ in стр], dtype=np.int64))
              print("готово:", len(стр), "векторов по 1024 токена", flush=True)
          except Exception:
              traceback.print_exc(); print("::error title=bge1024::" + repr(sys.exc_info()[1])[:250]); sys.exit(1)
          пат = os.environ.get("PAT", "")
          def put(путь, байты):
              импорт = urllib.parse.quote(путь)
              req = urllib.request.Request(f"https://api.github.com/repos/Ayt1741/hranilishe/contents/{импорт}",
                  headers={"Authorization": f"Bearer {пат}", "User-Agent": "arena", "Accept": "application/vnd.github+json"})
              ша = None
              try: ша = json.loads(urllib.request.urlopen(req, timeout=60).read()).get("sha")
              except Exception: pass
              тело = {"message": "векторы bge-m3 1024 токена (100% записи)", "content": base64.b64encode(байты).decode()}
              if ша: тело["sha"] = ша
              req2 = urllib.request.Request(f"https://api.github.com/repos/Ayt1741/hranilishe/contents/{импорт}",
                  method="PUT", data=json.dumps(тело).encode(),
                  headers={"Authorization": f"Bearer {пат}", "User-Agent": "arena",
                           "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
              print("залито:", путь, flush=True); urllib.request.urlopen(req2, timeout=600).read()
          for ф in ("данные/вект-записи.npy", "данные/вект-записи_ном.npy"):
              put("движок/результат-bge1024/" + os.path.basename(ф), open(ф, "rb").read())
          PY
        env:
          PAT: ${{ secrets.HRANILISHE_PAT }}

      - name: "Пересчёт векторов e5-large (если vectors=e5)"
        if: github.event.inputs.vectors == 'e5'
        run: |
          cd движок
          exec > >(tee /tmp/e5.log) 2>&1
          python - <<'PY'
          import importlib.util, os, sys, json, base64, urllib.request, urllib.parse, traceback
          spec = importlib.util.spec_from_file_location("eng", "engine.py")
          E = importlib.util.module_from_spec(spec); spec.loader.exec_module(E)
          try:
              E.скачать_журнал(); E.перестроить()
              n = E.пересчитать_векторы_torch("intfloat/multilingual-e5-large")
              print("векторов e5:", n, flush=True)
          except Exception:
              traceback.print_exc(); print("::error title=e5::" + repr(sys.exc_info()[1])[:250]); sys.exit(1)
          пат = os.environ.get("PAT", "")
          def put(путь, байты):
              импорт = urllib.parse.quote(путь)
              req = urllib.request.Request(f"https://api.github.com/repos/Ayt1741/hranilishe/contents/{импорт}",
                  headers={"Authorization": f"Bearer {пат}", "User-Agent": "arena", "Accept": "application/vnd.github+json"})
              ша = None
              try: ша = json.loads(urllib.request.urlopen(req, timeout=60).read()).get("sha")
              except Exception: pass
              тело = {"message": "векторы multilingual-e5-large", "content": base64.b64encode(байты).decode()}
              if ша: тело["sha"] = ша
              req2 = urllib.request.Request(f"https://api.github.com/repos/Ayt1741/hranilishe/contents/{импорт}",
                  method="PUT", data=json.dumps(тело).encode(),
                  headers={"Authorization": f"Bearer {пат}", "User-Agent": "arena",
                           "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
              print("залито:", путь, len(байты)//1048576, "МБ", flush=True)
              urllib.request.urlopen(req2, timeout=600).read()
          for ф in ("данные/вект-записи.npy", "данные/вект-записи_ном.npy"):
              put("движок/результат-e5/" + os.path.basename(ф), open(ф, "rb").read())
          PY
        env:
          PAT: ${{ secrets.HRANILISHE_PAT }}

      - name: Модели (bge-m3 + реранкер)
        run: |
          mkdir -p движок/модели/bge-m3-onnx движок/модели/реранк
          python - <<'PY'
          import urllib.request, sys, os
          def качать(url, куда, минимум):
              req = urllib.request.Request(url, headers={"User-Agent": "arena"})
              д = urllib.request.urlopen(req, timeout=1800).read()
              if len(д) < минимум:
                  print(f"::error title=скачивание::{куда} {len(д)} байт"); sys.exit(1)
              open(куда, "wb").write(д); print(os.path.basename(куда), len(д)//1048576, "МБ", flush=True)
          b3 = "https://huggingface.co/Xenova/bge-m3/resolve/main/"
          качать(b3+"onnx/model_int8.onnx", "движок/модели/bge-m3-onnx/model_int8.onnx", 500_000_000)
          for ф in ("tokenizer.json","tokenizer_config.json","config.json"):
              качать(b3+ф, "движок/модели/bge-m3-onnx/"+ф, 10)
          rr = "https://huggingface.co/metalmon80/bge-reranker-v2-m3-en-ru-onnx/resolve/main/"
          качать(rr+"model.int8.onnx", "движок/модели/реранк/model.int8.onnx", 300_000_000)
          for ф in ("tokenizer.json","tokenizer_config.json","config.json"):
              качать(rr+ф, "движок/модели/реранк/"+ф, 10)
          for url, куда in [("https://huggingface.co/BAAI/bge-m3/resolve/main/sentencepiece.bpe.model",
                             "движок/модели/bge-m3-onnx/sentencepiece.bpe.model"),
                            ("https://huggingface.co/BAAI/bge-reranker-v2-m3/resolve/main/sentencepiece.bpe.model",
                             "движок/модели/реранк/sentencepiece.bpe.model")]:
              try: качать(url, куда, 1_000_000)
              except SystemExit: pass
          PY
          ls -la движок/модели/*/

      - name: "Пересчёт векторов единым ONNX-эмбеддером"
        if: github.event.inputs.vectors == 'recalc'
        run: |
          cd движок
          exec > >(tee /tmp/vect.log) 2>&1
          python - <<'PY'
          import importlib.util, os, sys, json, base64, urllib.request, urllib.parse, traceback
          spec = importlib.util.spec_from_file_location("eng", "engine.py")
          E = importlib.util.module_from_spec(spec); spec.loader.exec_module(E)
          try:
              print("RAM:", E.доступно_мб(), "МБ", flush=True)
              E.скачать_журнал()
              E.перестроить()
              Е = E.пересчитать_векторы()
              print("векторов:", Е, flush=True)
          except Exception:
              traceback.print_exc(); print("::error title=векторы::" + repr(sys.exc_info()[1])[:250]); sys.exit(1)
          # заливаем сразу, не дожидаясь конца джобы (лимит 90 мин)
          пат = os.environ.get("PAT", "")
          def put(путь, байты):
              импорт = urllib.parse.quote(путь)
              req = urllib.request.Request(f"https://api.github.com/repos/Ayt1741/hranilishe/contents/{импорт}",
                  headers={"Authorization": f"Bearer {пат}", "User-Agent": "arena", "Accept": "application/vnd.github+json"})
              ша = None
              try: ша = json.loads(urllib.request.urlopen(req, timeout=60).read()).get("sha")
              except Exception: pass
              тело = {"message": "векторы: единый ONNX-эмбеддер", "content": base64.b64encode(байты).decode()}
              if ша: тело["sha"] = ша
              req2 = urllib.request.Request(f"https://api.github.com/repos/Ayt1741/hranilishe/contents/{импорт}",
                  method="PUT", data=json.dumps(тело).encode(),
                  headers={"Authorization": f"Bearer {пат}", "User-Agent": "arena",
                           "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
              print("залито:", путь, len(байты)//1048576, "МБ", flush=True)
              urllib.request.urlopen(req2, timeout=600).read()
          for ф in ("данные/вект-записи.npy", "данные/вект-записи_ном.npy"):
              put("движок/результат/" + os.path.basename(ф), open(ф, "rb").read())
          PY
        env:
          PAT: ${{ secrets.HRANILISHE_PAT }}
          ПФ_ПЕРЕСЧЁТ: "1"


      - name: "Замер без реранкера и с реранкером"
        env:
          GITHUB_TOKEN: ${{ secrets.HRANILISHE_PAT }}
        run: |
          cd движок
          exec > >(tee /tmp/rr.log) 2>&1
          echo "=== ОКРУЖЕНИЕ ==="
          ls -la данные/ 2>&1 || echo "папки данные НЕТ"
          ls -la 2>&1 | head -15
          echo "GITHUB_TOKEN задан: $([ -n "$GITHUB_TOKEN" ] && echo да || echo НЕТ)"

          python - <<'PY'
          import importlib.util, os, json, sqlite3, traceback, sys
          spec = importlib.util.spec_from_file_location("eng", "engine.py")
          E = importlib.util.module_from_spec(spec); spec.loader.exec_module(E)
          try:
              print("RAM доступно:", E.доступно_мб(), "МБ", flush=True)
              print("> журнал", flush=True)
              try:
                  ж = E.скачать_журнал()
                  print("  журнал:", ж, os.path.getsize(ж)//1024, "КБ", flush=True)
              except Exception:
                  traceback.print_exc()
                  print("::error title=журнал::" + repr(sys.exc_info()[1])[:250]); sys.exit(1)
              print("> индекс", flush=True); зап, куск = E.перестроить()
              if зап < 2000:
                  # урок: без GITHUB_TOKEN журнал не скачивался и индекс выходил пустым
                  print(f"::error title=индекс::только {зап} записей — журнал не скачался"); sys.exit(1)
              con = sqlite3.connect("file:данные/поиск-индекс.db?mode=ro", uri=True)
              досл = [(1951,1952),(1953,1954),(2084,2085),(2086,2087),(2098,2099),(2100,2101)]
              вопросы = [con.execute("SELECT substr(текст,1,400) FROM записи WHERE н=?", (в,)).fetchone()[0]
                         for в,_ in досл]
              пер = json.load(open("перефразы.json", encoding="utf-8"))
              новые = json.load(open("перефразы-20.json", encoding="utf-8")) if os.path.exists("перефразы-20.json") else []

              # РЕРАНКЕР ВКЛЮЧЁН по умолчанию: замер #18 (torch-векторы + глубина 400
              # + распространение + вопрос-векторы + DBSF):
              #   без реранка: досл 6/6 0.917 | 10: 8/10 0.438 | 20: 16/20 0.457
              #   с реранком: досл 6/6 0.667 | 10: 9/10 0.483 | 20: 17/20 0.506
              # Он добавляет +1/10 и +1/20 на перефразах (главная метрика), теряя MRR
              # только на дословных (6/6 остаётся). Выключить: РЕРАНК_ВКЛ=0.
              РЕР = __import__("os").environ.get("РЕРАНК_ВКЛ", "1") == "1"
              def замер(метка, с_рер):
                  с1=х1=0
                  for в, (_, о_н) in zip(вопросы, досл):
                      н=[р["н"] for р in E.искать(в,10,с_реранком=с_рер)]
                      if о_н in н: с1 += 1.0/(н.index(о_н)+1); х1+=1
                  с2=х2=0
                  for п in пер:
                      н=[р["н"] for р in E.искать(п["вопрос"],10,с_реранком=с_рер)]
                      if п["ответ"] in н: с2 += 1.0/(н.index(п["ответ"])+1); х2+=1
                  с3=х3=0
                  for п in новые:
                      н=[р["н"] for р in E.искать(п["вопрос"],10,с_реранком=с_рер)]
                      if п["ответ"] in н: с3 += 1.0/(н.index(п["ответ"])+1); х3+=1
                  print(f"{метка}: дословные {х1}/6 MRR {с1/6:.3f} | настроечные {х2}/10 MRR {с2/10:.3f}"
                          + (f" | новые {х3}/{len(новые)} MRR {с3/max(len(новые),1):.3f}" if новые else ""), flush=True)
                  return (х1, с1/6, х2, с2/10, х3, с3/max(len(новые),1))

              print("=== БЕЗ реранкера ===", flush=True); а = замер("без", False)
              print("=== С реранкером ===", flush=True); б = замер("с", True)
              # --- перебор смешивания скоров реранкера (в песочнице RAM не хватает) ---
              print("\n=== ПЕРЕБОР СМЕШИВАНИЯ (реранкер + первая стадия) ===", flush=True)
              import os as _os
              def замер_смесь(метка):
                  с1=х1=0
                  for в, (_, о_н) in zip(вопросы, досл):
                      н=[р["н"] for р in E.искать(в,10,с_реранком=True)]
                      if о_н in н: с1 += 1.0/(н.index(о_н)+1); х1+=1
                  с2=х2=0
                  for п in пер:
                      н=[р["н"] for р in E.искать(п["вопрос"],10,с_реранком=True)]
                      if п["ответ"] in н: с2 += 1.0/(н.index(п["ответ"])+1); х2+=1
                  с3=х3=0
                  for п in новые:
                      н=[р["н"] for р in E.искать(п["вопрос"],10,с_реранком=True)]
                      if п["ответ"] in н: с3 += 1.0/(н.index(п["ответ"])+1); х3+=1
                  print(f"  {метка}: досл {х1}/6 {с1/6:.3f} | 10: {х2}/10 {с2/10:.3f} | 20: {х3}/20 {с3/20:.3f}", flush=True)
              if РЕР:
                  try:
                      for вес in ("1.0", "0.8", "0.6"):
                          _os.environ["ПФ_РЕРАНК_ВЕС"] = вес
                          замер_смесь(f"реранк {вес}")
                  except Exception:
                      traceback.print_exc()
              print(f"\nПРИРОСТ: дословные {а[0]}→{б[0]} (MRR {а[1]:.3f}→{б[1]:.3f}) | "
                    f"настроечные {а[2]}→{б[2]} (MRR {а[3]:.3f}→{б[3]:.3f}) | "
                    f"новые {а[4]}→{б[4]} (MRR {а[5]:.3f}→{б[5]:.3f})", flush=True)
          except Exception:
              traceback.print_exc()
              print("::error title=замер::" + repr(sys.exc_info()[1])[:250]); sys.exit(1)
          PY

      - name: Лог в артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rerank-eval
          path: |
            /tmp/rr.log
            /tmp/vect.log
          retention-days: 7
