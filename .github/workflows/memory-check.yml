name: memory-check
# Проверка в облаке: скачивает готовый движок + векторы из hranilishe,
# строит индекс, качает bge-m3 ONNX и прогоняет замер перефразов.
# Зачем: подтвердить, что результат не «локальный артефакт», а воспроизводится на чистой машине.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  LC_ALL: C.UTF-8
  TOKENIZERS_PARALLELISM: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet onnxruntime==1.19.2 transformers tokenizers sentencepiece pymorphy3 numpy
          python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute('CREATE VIRTUAL TABLE t USING fts5(x)'); print('FTS5 ок')"

      - name: Забрать движок, векторы, наборы
        env:
          PAT: ${{ secrets.HRANILISHE_PAT }}
        run: |
          mkdir -p движок/данные
          python - <<'PY'
          import os, base64, urllib.request, urllib.parse, json
          пат = os.environ["PAT"]
          def залить(путь, куда):
              req = urllib.request.Request(
                  "https://api.github.com/repos/Ayt1741/hranilishe/contents/" + urllib.parse.quote(путь),
                  headers={"Authorization": f"Bearer {пат}", "User-Agent": "arena",
                           "Accept": "application/vnd.github+json"})
              d = json.loads(urllib.request.urlopen(req, timeout=120).read())
              open(куда, "wb").write(base64.b64decode(d["content"]))
              print(куда, os.path.getsize(куда)//1024, "КБ")
          # ВАЖНО: contents API отдаёт content только до 1 МБ (для 8,9 МБ приходит
          # encoding=none и пустое тело → «No data left in file» при np.load).
          # Поэтому большие файлы — только через raw.githubusercontent.
          def raw(путь, куда):
              url = ("https://raw.githubusercontent.com/Ayt1741/hranilishe/main/"
                     + urllib.parse.quote(путь))
              req = urllib.request.Request(url, headers={"User-Agent": "arena",
                                                         "Authorization": f"Bearer {пат}"})
              данные = urllib.request.urlopen(req, timeout=300).read()
              open(куда, "wb").write(данные)
              print(куда, len(данные), "байт")
          for путь, куда in [
              ("движок/результат/вект-записи.npy", "движок/данные/вект-записи.npy"),
              ("движок/результат/вект-записи_ном.npy", "движок/данные/вект-записи_ном.npy"),
          ]:
              raw(путь, куда)
          for путь, куда in [
              ("движок/engine.py", "движок/engine.py"),
              ("движок/перефразы.json", "движок/перефразы.json"),
          ]:
              залить(путь, куда)
          PY

      - name: bge-m3 ONNX int8 + токенизатор
        run: |
          mkdir -p движок/модели/bge-m3-onnx
          cd движок/модели/bge-m3-onnx
          # curl без --fail молча писал пустоту (так файл модели и «терялся»).
          # Скачиваем через Python с проверкой размера: модель 542 МБ.
          python - <<'PY'
          import urllib.request, os, sys
          база = "https://huggingface.co/Xenova/bge-m3/resolve/main"
          файлы = {"onnx/model_int8.onnx": "model_int8.onnx",
                   "tokenizer.json": "tokenizer.json",
                   "tokenizer_config.json": "tokenizer_config.json",
                   "special_tokens_map.json": "special_tokens_map.json",
                   "config.json": "config.json"}
          for путь, имя in файлы.items():
              req = urllib.request.Request(f"{база}/{путь}", headers={"User-Agent": "arena"})
              данные = urllib.request.urlopen(req, timeout=900).read()
              open(имя, "wb").write(данные)
              print(имя, len(данные), "байт", flush=True)
              if len(данные) < 1000:
                  print(f"::error title=скачивание::{имя} пустой"); sys.exit(1)
          if os.path.getsize("model_int8.onnx") < 500_000_000:
              print("::error title=модель::model_int8.onnx меньше 500 МБ"); sys.exit(1)
          # sentencepiece-модель для фолбэка токенизатора
          req = urllib.request.Request(
              "https://huggingface.co/BAAI/bge-m3/resolve/main/sentencepiece.bpe.model",
              headers={"User-Agent": "arena"})
          сп = urllib.request.urlopen(req, timeout=300).read()
          open("sentencepiece.bpe.model", "wb").write(сп)
          print("sentencepiece.bpe.model", len(сп), "байт")
          PY
          ls -la
          python - <<'PY'
          from transformers import AutoTokenizer
          try:
              т = AutoTokenizer.from_pretrained(".")
              print("токенизатор ок (быстрый):", type(т).__name__)
          except Exception as e:
              print("быстрый не поднялся:", repr(e)[:150], "— будет sentencepiece-фолбэк")
          PY

      - name: ПРОВЕРКА ТОКЕНИЗАТОРА
        run: |
          cd движок
          python - 2>&1 <<'PY' | tee /tmp/tok.log
          import sys, importlib.util, traceback
          spec = importlib.util.spec_from_file_location("eng", "engine.py")
          E = importlib.util.module_from_spec(spec); spec.loader.exec_module(E)
          try:
              v = E.вектор_запроса("проверка")
              print("токенизатор ок, режим:", E._ВЕК.get("режим"), "| вектор:", v.shape)
          except Exception:
              traceback.print_exc()
              print("::error title=токенизатор::" + repr(sys.exc_info()[1])[:250]); sys.exit(1)
          PY

      - name: Индекс + замер перефразов
        run: |
          cd движок
          python - 2>&1 <<'PY' | tee /tmp/eval.log
          import importlib.util, traceback, sys
          spec = importlib.util.spec_from_file_location("eng", "engine.py")
          E = importlib.util.module_from_spec(spec); spec.loader.exec_module(E)
          try:
              print("> журнал", flush=True); E.скачать_журнал()
              print("> индекс", flush=True); E.перестроить()
              print("> замер перефразов", flush=True)
              E.__dict__["__name__"] = "__main__"
              import json
              н = json.load(open("перефразы.json", encoding="utf-8"))
              пары = [(п["вопрос"], п["ответ"]) for п in н]
              mrr, хиты = E.замер(пары, "ПЕРЕФРАЗЫ")
              print(f"> ИТОГ: {хиты}/10, MRR {mrr:.3f}", flush=True)
          except Exception:
              traceback.print_exc()
              print("::error title=проверка::" + repr(sys.exc_info()[1])[:300])
              sys.exit(1)
          PY

      - name: Отдать лог
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-result
          path: |
            /tmp/eval.log
            /tmp/tok.log
          retention-days: 7
