name: login-turnstile
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          pip install -q playwright pyotp
          python -m playwright install --with-deps chromium
      - name: Вход
        env:
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_PASS: ${{ secrets.GOOGLE_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          mkdir -p /tmp/shots
          xvfb-run -a --server-args="-screen 0 1400x950x24" python3 - <<'PY' > /tmp/login.txt 2>&1
          import os, pyotp
          from playwright.sync_api import sync_playwright

          def пройти_turnstile(pg, метка=""):
              for попытка in range(6):
                  try:
                      for ф in pg.frames:
                          if "challenges.cloudflare.com" in (ф.url or ""):
                              ф.locator("body").first.click(timeout=5000, force=True)
                              pg.wait_for_timeout(6000)
                              print(f"  [{метка}] клик по iframe Turnstile, попытка {попытка}")
                              break
                  except Exception as e:
                      print(f"  [{метка}] err: {repr(e)[:100]}")
                  t = pg.inner_text('body')
                  if 'Подтвердите' not in t and 'Verify you are human' not in t.lower() and 'Security Verification' not in t:
                      print(f"  [{метка}] Turnstile пройден на попытке {попытка}")
                      return True
                  pg.wait_for_timeout(4000)
              print(f"  [{метка}] Turnstile НЕ пройден")
              return False

          with sync_playwright() as p:
              b = p.chromium.launch(headless=False, args=['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled'])
              ctx = b.new_context(viewport={'width':1400,'height':950}, locale='en-US')
              ctx.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              pg = ctx.new_page()
              pg.goto('https://arena.ai/text', timeout=120000)
              pg.wait_for_timeout(8000)
              ок = пройти_turnstile(pg, "старт")
              pg.screenshot(path='/tmp/shots/01-после-turnstile.png')
              t = pg.inner_text('body')
              print("textarea после Turnstile:", pg.locator('textarea').count(), "| видимых:", pg.locator('textarea:visible').count())
              print("Ask anything:", 'Ask anything' in t)
              # гостевой тест
              if pg.locator('textarea:visible').count():
                  print("=== ГОСТЕВОЙ РЕЖИМ ДОСТУПЕН ===")
                  try:
                      ta = pg.locator('textarea:visible').first
                      ta.click(timeout=5000); ta.fill("ping")
                      print("textarea заполнен ок")
                  except Exception as e: print("textarea err:", repr(e)[:150])

              if ок:
                  # логин: кнопка Log In
                  написал = False
                  for сел in ('button:has-text("Log In")','a:has-text("Log In")','button:has-text("Log in")','text=Log In'):
                      try:
                          pg.locator(сел).first.click(timeout=8000); print("клик вход:", сел); написал=True; break
                      except Exception: pass
                  pg.wait_for_timeout(5000)
                  pg.screenshot(path='/tmp/shots/03-меню.png')
                  print("после клика:", pg.inner_text('body')[:300].replace("\n"," | "))
                  # перечислить кнопки модалки
                  try:
                      кн = pg.locator('button:visible, a:visible').all_inner_texts()
                      print("кнопки:", [k.strip()[:30] for k in кн if k.strip()][:25])
                  except Exception: pass
                  page = pg
                  try:
                      with ctx.expect_page(timeout=20000) as инфо:
                          pg.locator("text=/Google/i").first.click(timeout=15000)
                      page = инфо.value
                      print("Google в новой вкладке")
                  except Exception as e:
                      print("Google новая вкладка нет:", repr(e)[:120])
                      try:
                          pg.locator("text=/Google/i").first.click(timeout=10000); print("Google клик в той же вкладке")
                      except Exception as e2: print("Google совсем нет:", repr(e2)[:120])
                  page.wait_for_timeout(6000)
                  page.screenshot(path='/tmp/shots/04-google.png')
                  print("url Google:", page.url, "|", page.title()[:80])
                  try:
                      page.fill('input[type=email]', os.environ['GOOGLE_EMAIL'], timeout=25000)
                      page.keyboard.press('Enter'); page.wait_for_timeout(8000)
                      page.screenshot(path='/tmp/shots/05-email.png'); print("email ок:", page.url[:80])
                      page.fill('input[type=password]', os.environ['GOOGLE_PASS'], timeout=25000)
                      page.keyboard.press('Enter'); page.wait_for_timeout(11000)
                      page.screenshot(path='/tmp/shots/06-пароль.png'); print("пароль ок:", page.url[:80])
                      if page.locator('input[type=tel]').count():
                          код = pyotp.TOTP(os.environ['TOTP_SECRET']).now()
                          print("TOTP:", код)
                          page.locator('input[type=tel]').first.fill(код); page.keyboard.press('Enter')
                          page.wait_for_timeout(12000)
                          page.screenshot(path='/tmp/shots/07-totp.png')
                      print("после google url:", page.url[:100])
                  except Exception as e:
                      print("ШАГ GOOGLE УПАЛ:", repr(e)[:300])
                      try: page.screenshot(path='/tmp/shots/08-ошибка.png')
                      except Exception: pass
                  try:
                      if page is not pg: page.close()
                  except Exception: pass
              pg.goto('https://arena.ai/text', timeout=120000)
              pg.wait_for_timeout(9000)
              пройти_turnstile(pg, "финал")
              pg.screenshot(path='/tmp/shots/09-финал.png')
              t2 = pg.inner_text('body')
              print("=== ИТОГ ===")
              print("ВОШЁЛ:", 'Get started' not in t2 and 'Sign up' not in t2 and 'Log In' not in t2)
              print("Ask anything:", 'Ask anything' in t2)
              print("textarea видимых:", pg.locator('textarea:visible').count())
              print("куки:", len(ctx.cookies()))
              ctx.storage_state(path='state.json')
              print("state.json:", os.path.getsize('state.json'), "Б")
              b.close()
          PY
          cat /tmp/login.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login
          path: |
            /tmp/login.txt
            /tmp/shots/
            state.json
