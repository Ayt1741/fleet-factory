name: capacity
on:
  workflow_dispatch:
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Сколько браузеров реально тянет одна машина
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          with sync_playwright() as p:
              for n in (1, 4, 8, 12, 16):
                  b = p.chromium.launch(headless=True, args=['--no-sandbox','--disable-dev-shm-usage'])
                  t0 = time.time(); ok = 0; lengths = []
                  ctxs = [b.new_context(locale='ru-RU', user_agent=UA) for _ in range(n)]
                  pgs = [c.new_page() for c in ctxs]
                  for pg in pgs:
                      try:
                          r = pg.goto('https://arena.ai/text', timeout=60000)
                          pg.wait_for_timeout(6000)
                          t = pg.inner_text('body')
                          lengths.append(len(t))
                          if r and r.status == 200 and len(t) > 500:
                              ok += 1
                      except Exception:
                          lengths.append(-1)
                  print(f'RESULT браузеров={n} успешно={ok} время={time.time()-t0:.1f}с длины={lengths[:6]}')
                  for c in ctxs:
                      try: c.close()
                      except Exception: pass
                  b.close()
          PY
